<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CarZoneDB - Upgrade Calculator</title>

  <link rel="icon" type="image/x-icon"
    href="https://raw.githubusercontent.com/CarZoneDB/CarZoneDB.github.io/refs/heads/main/assets/favicon.png">

  <link rel="stylesheet" href="../components/base.css">
  <link rel="stylesheet" href="../cars/style.css">

  <style>
    /* ===== Layout ===== */

    .sect {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .calc-layout {
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
      gap: 24px;
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      align-items: start;
    }

    /* ===== Left Panel ===== */

    .panel-left {
      background: var(--foreground-color);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      position: sticky;
      top: 20px;
    }

    .panel-left .filter-bar {
      padding: 14px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 0;
    }

    .car-browser-scroll {
      max-height: calc(100vh - 180px);
      overflow-y: auto;
      padding: 14px;
    }

    /* ===== Reuse Cars Page Cards ===== */

    .card-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .car-card {
      cursor: pointer;
      transition:
        transform 0.15s ease,
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .car-card:hover {
      transform: translateY(-2px);
    }

    .car-card.selected {
      border: 2px solid var(--accent-color);
      box-shadow: 0 0 0 1px var(--accent-color);
    }

    /* ===== Right Panel ===== */

    .panel-right {
      min-width: 0;
    }

    .calc-card {
      background: var(--foreground-color);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 24px;
    }

    .calc-empty {
      background: var(--foreground-color);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 80px 24px;
      text-align: center;
      opacity: 0.5;
    }

    .calc-card h2 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 2rem;
    }

    .base-price {
      opacity: 0.6;
      margin-bottom: 20px;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border-color);
      margin: 24px 0;
    }

    /* ===== Upgrades ===== */

    .upgrades-section {
      margin-top: 24px;
    }

    .upgrades-section h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0.5;
      margin-bottom: 14px;
    }

    .upgrades-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .upgrade-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .upgrade-group label {
      font-size: 0.75rem;
      text-transform: uppercase;
      opacity: 0.5;
      font-weight: 600;
    }

    .upgrade-group select {
      background: var(--background-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 14px;
      min-height: 44px;
      font-family: var(--font-family);
      font-size: 14px;
    }

    /* ===== Summary ===== */

    .summary-bar {
      margin-top: 28px;
      padding: 18px;
      border-radius: 14px;
      background: var(--background-color);
      border: 1px solid var(--border-color);

      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .summary-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .summary-item span:first-child {
      font-size: 0.75rem;
      opacity: 0.5;
      text-transform: uppercase;
    }

    .summary-item span:last-child {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .summary-item.total span:last-child {
      color: var(--accent-color);
      font-size: 1.6rem;
    }

    /* ===== Responsive ===== */

    @media (max-width: 900px) {
      .calc-layout {
        grid-template-columns: 1fr;
      }

      .panel-left {
        position: static;
      }

      .car-browser-scroll {
        max-height: 400px;
      }
    }
  </style>
</head>

<body>

  <div id="navbar"></div>

  <main class="sect">

    <div class="calc-layout">

      <!-- LEFT -->

      <div class="panel-left">

        <div class="filter-bar">
          <input
            type="text"
            placeholder="Search cars..."
            class="filter-input"
            id="carSearch"
            oninput="filterCars()"
          >
        </div>

        <div class="car-browser-scroll">
          <div class="card-container" id="card-container"></div>
        </div>

      </div>

      <!-- RIGHT -->

      <div class="panel-right" id="panelRight">

        <div class="calc-empty">
          Select a car to calculate upgrade costs.
        </div>

      </div>

    </div>

  </main>

  <div id="footer"></div>

  <script src="../components/elementloader.js"></script>

  <script>

    const UPGRADES = {
      Engine: [
        ['Stock', 0],
        ['Street', 0.10],
        ['Sport', 0.15],
        ['Race', 0.20]
      ],
      Gearbox: [
        ['Stock', 0],
        ['Street', 0.05],
        ['Sport', 0.07],
        ['Race', 0.10]
      ],
      Turbo: [
        ['Stock', 0],
        ['Turbo', 0.05],
        ['Twin Turbo', 0.10]
      ],
      Brakes: [
        ['Stock', 0],
        ['Street', 0.05],
        ['Sport', 0.07],
        ['Race', 0.10]
      ]
    };

    let allCars = [];
    let filteredCars = [];
    let selectedCar = null;

    function fmt(n) {
      return '$' + Math.round(n).toLocaleString();
    }

    function normalizeCar(car) {
      return {
        CarName: car.CarName || 'Unknown',
        PRICE: car.PRICE || 0,
        TYPE: car.TYPE || 'Unknown',
        NEWCAR: car.NEWCAR || false,
        IMAGE: car.IMAGE || ''
      };
    }

    function renderCars() {

      const container = document.getElementById('card-container');

      if (!filteredCars.length) {
        container.innerHTML = `<p>No cars found.</p>`;
        return;
      }

      container.innerHTML = filteredCars.map(car => {

        const selected =
          selectedCar &&
          selectedCar.CarName === car.CarName;

        return `
          <div
            class="car-card ${selected ? 'selected' : ''}"
            onclick="selectCar('${car.CarName.replace(/'/g, "\\'")}')"
          >

            <img
              src="${car.IMAGE || 'https://placehold.co/600x300'}"
              alt="${car.CarName}"
              class="card-image"
            >

            <div class="card-content">

              <div class="badges">
                ${car.NEWCAR ? `<span class="badge new">NEW</span>` : ''}
                ${car.TYPE === 'Limited'
                  ? `<span class="badge limited">LIMITED</span>`
                  : ''}
              </div>

              <h3>${car.CarName}</h3>

              <p>${fmt(car.PRICE)}</p>

            </div>

          </div>
        `;

      }).join('');
    }

    function filterCars() {

      const q =
        document
          .getElementById('carSearch')
          .value
          .toLowerCase();

      filteredCars = allCars.filter(car =>
        car.CarName.toLowerCase().includes(q)
      );

      renderCars();
    }

    function selectCar(name) {

      selectedCar =
        allCars.find(c => c.CarName === name);

      renderCars();
      renderCalculator();
    }

    function renderCalculator() {

      const right =
        document.getElementById('panelRight');

      if (!selectedCar) {
        right.innerHTML = `
          <div class="calc-empty">
            Select a car to calculate upgrade costs.
          </div>
        `;
        return;
      }

      let upgradesHTML = '';

      Object.entries(UPGRADES).forEach(([group, options]) => {

        upgradesHTML += `
          <div class="upgrade-group">

            <label>${group}</label>

            <select onchange="recalc()">

              ${options.map((opt, i) => {

                const cost =
                  Math.round(selectedCar.PRICE * opt[1]);

                return `
                  <option value="${cost}">
                    ${opt[0]}
                    ${cost > 0 ? `(+${fmt(cost)})` : ''}
                  </option>
                `;

              }).join('')}

            </select>

          </div>
        `;
      });

      right.innerHTML = `
        <div class="calc-card">

          <h2>${selectedCar.CarName}</h2>

          <div class="base-price">
            Base Price:
            <strong>${fmt(selectedCar.PRICE)}</strong>
          </div>

          <hr class="divider">

          <div class="upgrades-section">

            <h3>Performance Upgrades</h3>

            <div class="upgrades-grid">
              ${upgradesHTML}
            </div>

          </div>

          <div class="summary-bar">

            <div class="summary-item">
              <span>Base</span>
              <span id="sumBase">${fmt(selectedCar.PRICE)}</span>
            </div>

            <div class="summary-item">
              <span>Upgrades</span>
              <span id="sumUpgrades">$0</span>
            </div>

            <div class="summary-item total">
              <span>Total</span>
              <span id="sumTotal">${fmt(selectedCar.PRICE)}</span>
            </div>

          </div>

        </div>
      `;

      recalc();
    }

    function recalc() {

      if (!selectedCar) return;

      let upgrades = 0;

      document
        .querySelectorAll('select')
        .forEach(select => {
          upgrades += Number(select.value);
        });

      document.getElementById('sumUpgrades')
        .textContent = fmt(upgrades);

      document.getElementById('sumTotal')
        .textContent =
          fmt(selectedCar.PRICE + upgrades);
    }

    fetch('https://carzonedb.github.io/assets/infojsons/cars.json')

      .then(r => r.json())

      .then(api => {

        allCars =
          Object
            .values(api.data || {})
            .map(normalizeCar)
            .sort((a, b) =>
              a.CarName.localeCompare(b.CarName)
            );

        filteredCars = allCars;

        renderCars();

      })

      .catch(err => {

        console.error(err);

        document.getElementById('card-container')
          .innerHTML =
            `<p>Failed to load cars.</p>`;
      });

  </script>

</body>
</html>
